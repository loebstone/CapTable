openapi: 3.1.0
info:
  title: Api
  version: 1.0.0
  description: HWD Cap Table foundation API
servers:
  - url: /api
paths:
  /suite/menu:
    get:
      operationId: getSuiteMenu
      responses:
        "200":
          description: Cached authenticated Farm navigation using a built-in logo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuiteMenu"
  /auth/sso:
    get:
      operationId: redeemRosterSso
      description: Also mounted at /auth/sso for the registered Roster callback. Anonymous ticket credential; local membership/bootstrap required.
      parameters:
        - {name: ticket, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 4096}}
        - {name: to, in: query, schema: {type: string, default: "/"}}
      responses:
        "303": {description: Normal session cookie issued; safe local redirect}
        "400": {description: Invalid return path; plain restart page}
        "401": {description: Refused or expired ticket; plain restart page}
        "403": {description: No active access or stale identity; plain restart page}
        "429": {description: More than 20 attempts per real IP in 15 minutes}
        "503": {description: Roster unavailable; fail closed}
  /auth/roster:
    get:
      operationId: startRosterSignIn
      parameters:
        - {name: to, in: query, schema: {type: string, default: "/"}}
        - {name: fresh, in: query, schema: {type: string, enum: ["1"]}}
      responses:
        "303": {description: Redirect to registered Roster entry URL; fresh=1 requests a new email verification}
  /auth/farm-sign-out:
    get:
      operationId: startFarmSignOut
      responses:
        "303": {description: Redirect to Roster sign-out after local logout}
  /signing/open:
    get:
      operationId: openSigningLink
      parameters:
        - {name: token, in: query, required: true, schema: {type: string, pattern: "^[a-f0-9]{64}$"}}
      responses:
        "200":
          description: Continue-only landing; no token consumption or session
          content:
            text/html:
              schema: {type: string}
        "410":
          description: Spent, expired, voided or invalid link
          content:
            text/plain:
              schema: {type: string}
  /signing/continue:
    post:
      operationId: continueSigningLink
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: {$ref: "#/components/schemas/SigningContinueInput"}
      responses:
        "303":
          description: Restricted signing cookie established; redirect to public signing page
        "403":
          description: Same-origin check failed
        "410":
          description: Spent, expired, voided or invalid link
  /signing/session:
    get:
      operationId: getSigningSession
      responses:
        "200":
          description: Restricted signing session only; no management access
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SigningSession"}
  /signing/sign:
    post:
      operationId: signDirection
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SignatureInput"}
      responses:
        "200":
          description: Signed and awaiting management confirmation
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SigningSession"}
  /years/{id}/directions:
    get:
      operationId: getDirections
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        "200":
          description: Direction and mailing status per holder
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DirectionView"}
  /years/{id}/directions/issue:
    post:
      operationId: issueDirectionLink
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DirectionIssueInput"}
      responses:
        "200":
          description: Link reissued and previous links voided; email result recorded
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DirectionDispatch"}
  /years/{id}/directions/resend:
    post:
      operationId: resendDirectionEnvelope
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DirectionIssueInput"}
      responses:
        "200":
          description: Complete original envelope resent with a fresh signing link; practice is self-addressed only
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailingSendResult"}
  /years/{id}/directions/paper.pdf:
    get:
      operationId: printPaperDirections
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        "200":
          description: Blank direction documents for the paper list, with signature and date lines
          content:
            application/pdf:
              schema: {type: string, format: binary}
  /years/{id}/directions/remind:
    post:
      operationId: remindDirections
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        "200":
          description: Explicit reminders to eligible unsigned email holders
          content:
            application/json:
              schema:
                type: object
                required: [count]
                properties:
                  count: {type: integer}
                  sentCount: {type: integer}
                  failedCount: {type: integer}
                  unknownCount: {type: integer}
  /years/{id}/directions/{directionId}/confirm:
    post:
      operationId: confirmDirection
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
        - {name: directionId, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DirectionConfirmInput"}
      responses:
        "200":
          description: APIC recorded atomically and direction confirmed
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DirectionView"}
  /years/{id}/directions/paper:
    post:
      operationId: recordPaperDirection
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PaperDirectionInput"}
      responses:
        "200":
          description: Paper direction confirmed and APIC recorded atomically
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DirectionView"}
  /years/{id}/directions/{directionId}/pdf:
    get:
      operationId: downloadDirectionPdf
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
        - {name: directionId, in: path, required: true, schema: {type: integer}}
      responses:
        "200":
          description: Access-checked sealed signed PDF or paper scan
          content:
            application/pdf:
              schema: {type: string, format: binary}
  /healthz:
    get:
      operationId: healthCheck
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HealthStatus"}
  /auth/link:
    post:
      operationId: requestSignIn
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EmailInput"}
      responses:
        "200":
          description: Link requested
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Message"}
  /auth/verify:
    get:
      operationId: verifySignIn
      parameters:
        - {name: token, in: query, required: true, schema: {type: string}}
      responses:
        "200":
          description: Confirmation page; GET never consumes the token or creates a session
          content:
            text/html:
              schema: {type: string}
    post:
      operationId: redeemSignIn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string}
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token]
              properties:
                token: {type: string}
      responses:
        "303": {description: Token consumed; signed in and redirected}
  /auth/session:
    get:
      operationId: getSession
      responses:
        "200":
          description: Current identity and environment
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Session"}
  /auth/logout:
    post:
      operationId: signOut
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Message"}
  /holdings:
    get:
      operationId: getHoldings
      responses:
        "200":
          description: Last fetched holdings, or null before first load
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HoldingsResult"}
  /holdings/fetch:
    post:
      operationId: fetchHoldings
      responses:
        "200":
          description: Fetch, validate, and store current Roster holdings
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Holdings"}
  /snapshots:
    get:
      operationId: listSnapshots
      responses:
        "200":
          description: Immutable snapshots
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/Snapshot"}}
    post:
      operationId: takeSnapshot
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SnapshotInput"}
      responses:
        "201":
          description: Snapshot created from stored fetch
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Snapshot"}
  /snapshots/{id}:
    get:
      operationId: getSnapshot
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}}
      responses:
        "200":
          description: Snapshot including every row
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Holdings"}
  /residences:
    get:
      operationId: listResidences
      responses:
        "200":
          description: Current residence per person; history is retained
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/Residence"}}
    post:
      operationId: saveResidence
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ResidenceInput"}
      responses:
        "201":
          description: New residence revision
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Residence"}
  /residences/confirm-all:
    post:
      operationId: confirmAllResidences
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ResidenceBatchInput"}
      responses:
        "200":
          description: Atomically confirmed current proposals; missing states skipped
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ResidenceBatchResult"}
        "409":
          description: Eligible residence revisions changed since preview; nothing written
  /rates:
    get:
      operationId: listRates
      responses:
        "200":
          description: Current revision of each tax year
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/RateTable"}}
    post:
      operationId: saveRates
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RateInput"}
      responses:
        "201":
          description: New annual rate revision
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RateTable"}
  /rates/copy:
    post:
      operationId: copyRates
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RateCopyInput"}
      responses:
        "201":
          description: New year copied exactly from prior year
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RateTable"}
  /rates/csv/preview:
    post:
      operationId: previewRateCsv
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RateCsvInput"}
      responses:
        "200":
          description: Validated preview; no writes
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RateCsvPreview"}
  /rates/csv/confirm:
    post:
      operationId: confirmRateCsv
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RateCsvConfirmation"}
      responses:
        "200":
          description: Atomic changed-only import, or unchanged no-op
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RateCsvResult"}
  /rates/{taxYear}/csv:
    get:
      operationId: downloadRatesCsv
      parameters:
        - in: path
          name: taxYear
          required: true
          schema: {type: integer, minimum: 1900, maximum: 9999}
      responses:
        "200":
          description: Current annual rates as CSV
          content:
            text/csv:
              schema: {type: string}
  /access:
    get:
      operationId: listAccess
      responses:
        "200":
          description: Current and removed access entries
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/AccessEntry"}}
    post:
      operationId: addAccess
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AccessInput"}
      responses:
        "201":
          description: Roster-verified person added
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AccessEntry"}
  /access/remove:
    post:
      operationId: removeAccess
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AccessRemovalInput"}
      responses:
        "201":
          description: Removal recorded as new revision
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AccessEntry"}
  /audit:
    get:
      operationId: listAudit
      responses:
        "200":
          description: Most recent 100 append-only write events
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/AuditEntry"}}
  /backup/confirm:
    get:
      operationId: backupConfirmation
      responses:
        "200":
          description: Access-checked confirmation page; no backup or write on GET
          content:
            text/html:
              schema: {type: string}
  /backup:
    post:
      operationId: downloadBackup
      responses:
        "200":
          description: On-demand private logical SQL and source document backup; 500 MB maximum
          content:
            application/zip:
              schema: {type: string, format: binary}
        "413":
          description: Backup exceeds the maximum; no archive released
  /years:
    get:
      operationId: listYears
      responses:
        "200":
          description: Real distribution years only; practice years are isolated
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/YearSummary"}}
    post:
      operationId: openYear
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/YearInput"}
      responses:
        "201":
          description: Year opened with frozen snapshot
          content:
            application/json:
              schema: {$ref: "#/components/schemas/YearDetail"}
  /practice-years:
    get:
      operationId: listPracticeYears
      responses:
        "200":
          description: Practice years only
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/YearSummary"}}
  /years/{id}/reset-practice:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
    post:
      operationId: resetPracticeYear
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PracticeResetInput"}
      responses:
        "200":
          description: Practice contents removed, snapshot and year identity retained
          content:
            application/json:
              schema: {$ref: "#/components/schemas/YearDetail"}
        "403":
          description: Real year reset refused and audit logged
  /years/{id}:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
    get:
      operationId: getYear
      responses:
        "200":
          description: Figures, worked arithmetic, holder calculations, ledger and history
          content:
            application/json:
              schema: {$ref: "#/components/schemas/YearDetail"}
  /years/{id}/figures:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
    post:
      operationId: saveYearFigures
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/YearFiguresInput"}
      responses:
        "201":
          description: New draft figures revision
          content:
            application/json:
              schema: {$ref: "#/components/schemas/YearDetail"}
  /years/{id}/figures/documents:
    post:
      operationId: linkFigureDocument
      parameters:
        - {$ref: "#/components/parameters/YearId"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/FigureDocumentInput"}
      responses:
        "201":
          description: Appended figures revision with unchanged amounts
          content:
            application/json:
              schema: {$ref: "#/components/schemas/YearDetail"}
  /years/{id}/declaration:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
    post:
      operationId: declareYear
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DeclarationInput"}
      responses:
        "201":
          description: Declared per-share amount and date recorded
          content:
            application/json:
              schema: {$ref: "#/components/schemas/YearDetail"}
  /years/{id}/finalize:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
    post:
      operationId: finalizeYear
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NoteInput"}
      responses:
        "201":
          description: Finalized and locked
          content:
            application/json:
              schema: {$ref: "#/components/schemas/YearDetail"}
  /years/{id}/corrections:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
    post:
      operationId: correctYear
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/YearCorrectionInput"}
      responses:
        "201":
          description: Append-only correction to frozen inputs, original preserved
          content:
            application/json:
              schema: {$ref: "#/components/schemas/YearDetail"}
  /years/{id}/payments:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
    post:
      operationId: recordPayment
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PaymentInput"}
      responses:
        "201":
          description: Cash paid or retained APIC recorded
          content:
            application/json:
              schema: {$ref: "#/components/schemas/YearDetail"}
  /years/{id}/reversals:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
    post:
      operationId: reversePayment
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReversalInput"}
      responses:
        "201":
          description: Negative reversal appended
          content:
            application/json:
              schema: {$ref: "#/components/schemas/YearDetail"}
  /years/{id}/holds:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
    post:
      operationId: setYearHold
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/HoldInput"}
      responses:
        "201":
          description: Hold or release recorded
          content:
            application/json:
              schema: {$ref: "#/components/schemas/YearDetail"}
  /years/{id}/documents/uploads:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
    post:
      operationId: requestYearUpload
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DocumentUploadInput"}
      responses:
        "201":
          description: Private staging upload reserved; PUT bytes directly to uploadURL
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DocumentUpload"}
  /years/{id}/documents:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
    post:
      operationId: attachYearDocument
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DocumentAttachmentInput"}
      responses:
        "201":
          description: File verified, sealed and attached with filename and upload date
          content:
            application/json:
              schema: {$ref: "#/components/schemas/YearDocument"}
  /years/{id}/documents/{documentId}/file:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
      - {name: documentId, in: path, required: true, schema: {type: integer}}
    get:
      operationId: downloadYearDocument
      responses:
        "200":
          description: Authenticated private document download
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
  /years/{id}/reports/notice/{personId}.pdf:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
      - {name: personId, in: path, required: true, schema: {type: string}}
    get:
      operationId: downloadNotice
      responses:
        "200":
          description: Private one-page shareholder distribution notice; practice at any stage, real years finalized only
          content:
            application/pdf:
              schema: {type: string, format: binary}
  /years/{id}/reports/notices.zip:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
    get:
      operationId: downloadNoticesZip
      responses:
        "200":
          description: Private ZIP of shareholder distribution notices with the same gate as statements
          content:
            application/zip:
              schema: {type: string, format: binary}
  /years/{id}/reports/statement/{personId}.pdf:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
      - {name: personId, in: path, required: true, schema: {type: string}}
    get:
      operationId: downloadStatement
      responses:
        "200":
          description: One-page private shareholder statement, finalized years only
          content:
            application/pdf:
              schema: {type: string, format: binary}
  /years/{id}/reports/statements.zip:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
    get:
      operationId: downloadStatementsZip
      responses:
        "200":
          description: One private PDF per distinct shareholder, finalized years only
          content:
            application/zip:
              schema: {type: string, format: binary}
  /years/{id}/reports/board.pdf:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
    get:
      operationId: downloadBoardSummary
      responses:
        "200":
          description: One-page board summary for an open or finalized year
          content:
            application/pdf:
              schema: {type: string, format: binary}
  /years/{id}/reports/ledger.xlsx:
    parameters:
      - {name: id, in: path, required: true, schema: {type: integer}}
    get:
      operationId: downloadLedger
      responses:
        "200":
          description: Numeric cash/APIC/reversal ledger and shareholder summary workbook
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: {type: string, format: binary}
  /mail/settings:
    get:
      operationId: getMailSettings
      responses:
        "200":
          description: Reply-to setting
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailSettings"}
    post:
      operationId: saveMailSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MailSettings"}
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailSettings"}
  /mail/paper:
    post:
      operationId: savePaperPreference
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PaperPreferenceInput"}
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Message"}
  /years/{id}/mailing:
    parameters:
      - {$ref: "#/components/parameters/YearId"}
    get:
      operationId: getMailing
      responses:
        "200":
          description: Draft, recipients, and delivery history
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MailingView"}
    post:
      operationId: saveMailing
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MailingContent"}
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Message"}
  /years/{id}/mailing/send:
    parameters:
      - {$ref: "#/components/parameters/YearId"}
    post:
      operationId: sendMailing
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MailingSendInput"}
      responses:
        "200":
          description: Per-recipient results
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required: [personId, result]
                      properties:
                        personId: {type: string}
                        result: {type: string}
                        messageId: {type: [string, "null"]}
                        detail: {type: string}
  /years/{id}/mailing/paper.pdf:
    parameters:
      - {$ref: "#/components/parameters/YearId"}
    get:
      operationId: printMailingLetters
      responses:
        "200":
          description: Combined paper-recipient PDF
          content:
            application/pdf:
              schema: {type: string, format: binary}
  /mail/webhook:
    post:
      operationId: receiveMailWebhook
      description: Public callback authenticated by Svix signature, not a browser session.
      responses:
        "200":
          description: Event recorded
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Message"}
components:
  parameters:
    YearId:
      name: id
      in: path
      required: true
      schema: {type: integer, minimum: 1}
  schemas:
    SigningContinueInput:
      type: object
      required: [token]
      properties:
        token: {type: string, pattern: "^[a-f0-9]{64}$"}
    SignatureInput:
      type: object
      required: [amountCents, fullName, consent]
      properties:
        amountCents: {type: string, pattern: '^\d+$'}
        fullName: {type: string}
        consent: {type: boolean}
    SigningSession:
      type: object
      required: [state, holderName, calendarYear, boardApprovalDate, amountCents, maxAmountCents, templateVersion, templateText, consentText, isPractice]
      properties:
        state: {type: string, enum: [ready, signed]}
        holderName: {type: string}
        calendarYear: {type: integer}
        boardApprovalDate: {type: string}
        amountCents: {type: string}
        maxAmountCents: {type: string}
        templateVersion: {type: integer}
        templateText: {type: string}
        consentText: {type: string}
        isPractice: {type: boolean}
        signedAt: {type: string}
        receiptResult: {type: string}
    DirectionIssueInput:
      type: object
      required: [personId]
      properties:
        personId: {type: string}
    DirectionConfirmInput:
      type: object
      properties:
        note: {type: string}
    PaperDirectionInput:
      type: object
      required: [personId, amountCents, receivedDate]
      properties:
        personId: {type: string}
        amountCents: {type: string, pattern: '^\d+$'}
        receivedDate: {type: string}
        documentId: {type: integer}
        note: {type: string}
    DirectionDispatch:
      type: object
      required: [linkId, expiresAt, result]
      properties:
        linkId: {type: integer}
        expiresAt: {type: string}
        messageId: {type: [string, "null"]}
        result: {type: string}
    MailingSendResult:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            type: object
            required: [personId, result]
            properties:
              personId: {type: string}
              result: {type: string}
              messageId: {type: [string, "null"]}
              detail: {type: string}
    DirectionStatusRow:
      type: object
      required: [personId, displayName, channel, email, mailingStatus, documentStatus, instruction, maxAmountCents, canConfirm, canRemind, canIssue]
      properties:
        personId: {type: string}
        displayName: {type: string}
        channel: {type: string}
        email: {type: [string, "null"]}
        mailingStatus: {type: string}
        documentStatus: {type: string}
        instruction: {type: string}
        maxAmountCents: {type: [string, "null"]}
        directionId: {type: [integer, "null"]}
        amountCents: {type: [string, "null"]}
        canConfirm: {type: boolean}
        canRemind: {type: boolean}
        canIssue: {type: boolean}
        canResendEnvelope: {type: boolean}
        resendCount: {type: integer}
        resendBlocked: {type: [string, "null"]}
        confirmationBlocked: {type: [string, "null"]}
        pdfUrl: {type: [string, "null"]}
        expiresAt: {type: [string, "null"]}
        history: {type: array, items: {$ref: "#/components/schemas/DirectionHistory"}}
    DirectionHistory:
      type: object
      required: [id, kind, amountCents, confirmed, createdAt]
      properties:
        id: {type: integer}
        kind: {type: string}
        amountCents: {type: string}
        confirmed: {type: boolean}
        createdAt: {type: string}
        pdfUrl: {type: [string, "null"]}
    DirectionView:
      type: object
      required: [yearId, calendarYear, isPractice, rows]
      properties:
        yearId: {type: integer}
        calendarYear: {type: integer}
        isPractice: {type: boolean}
        rows: {type: array, items: {$ref: "#/components/schemas/DirectionStatusRow"}}
    PaperPreferenceInput:
      type: object
      required: [personId, prefersPaper]
      properties:
        personId: {type: string}
        prefersPaper: {type: boolean}
    MailingSendInput:
      type: object
      required: [kind, draftId]
      properties:
        kind: {type: string, enum: [send, resend, preview]}
        draftId: {type: integer}
        personId: {type: string}
    MailSettings:
      type: object
      required: [replyTo]
      properties:
        replyTo: {type: string, format: email}
    MailingContent:
      type: object
      required: [subject, body, documentIds, attachment, choices]
      properties:
        subject: {type: string}
        body: {type: string}
        documentIds: {type: array, items: {type: integer}}
        attachment: {type: string, enum: [notice, statement, none]}
        choices: {type: object, additionalProperties: {type: string, enum: [notice, statement, none]}}
        includeSigningLink: {type: boolean}
    MailingView:
      type: object
      required: [calendarYear, draftId, content, status, replyTo, isPractice, recipients, documents]
      properties:
        calendarYear: {type: integer}
        draftId: {type: [integer, "null"]}
        content: {$ref: "#/components/schemas/MailingContent"}
        status: {type: string, enum: [draft, sent]}
        replyTo: {type: string}
        isPractice: {type: boolean}
        recipients:
          type: array
          items:
            type: object
            required: [personId, displayName, email, prefersPaper, channel, status, attachment, canResend]
            properties:
              personId: {type: string}
              displayName: {type: string}
              email: {type: [string, "null"]}
              prefersPaper: {type: boolean}
              channel: {type: string, enum: [Email, Paper, No email]}
              status: {type: string}
              attachment: {type: string, enum: [notice, statement, none]}
              canResend: {type: boolean}
              messageId: {type: [string, "null"]}
              sentAt: {type: [string, "null"]}
              detail: {type: [string, "null"]}
        documents:
          type: array
          items:
            type: object
            required: [id, filename, contentType, size]
            properties:
              id: {type: integer}
              filename: {type: string}
              contentType: {type: string}
              size: {type: integer}
    NoteInput:
      type: object
      properties:
        note: {type: string, default: "", maxLength: 5000}
    YearInput:
      type: object
      required: [calendarYear, snapshotId]
      properties:
        calendarYear: {type: integer, minimum: 1900, maximum: 9999}
        isPractice: {type: boolean, default: false}
        snapshotId: {type: integer, minimum: 1}
        note: {type: string, default: ""}
    PracticeResetInput:
      type: object
      required: [confirmation]
      properties:
        confirmation: {type: string, enum: [RESET]}
    YearSummary:
      type: object
      required: [id, calendarYear, isPractice, snapshotId, status, createdAt, createdBy]
      properties:
        id: {type: integer}
        calendarYear: {type: integer}
        isPractice: {type: boolean}
        snapshotId: {type: integer}
        status: {type: string, enum: [draft, finalized, corrected]}
        createdAt: {type: string}
        createdBy: {type: string}
    CostLineInput:
      type: object
      required: [amountCents]
      properties:
        label: {type: string, default: "Direct cost", maxLength: 200}
        amountCents: {type: string, pattern: '^\d{1,15}$'}
        documentId: {type: [integer, "null"], minimum: 1}
    YearFiguresInput:
      type: object
      required: [grossCents, costs]
      properties:
        grossCents: {type: string, pattern: '^\d{1,15}$'}
        grossDocumentId: {type: [integer, "null"], minimum: 1}
        costs: {type: array, maxItems: 100, items: {$ref: "#/components/schemas/CostLineInput"}}
        note: {type: string, default: ""}
    FigureDocumentInput:
      type: object
      required: [figuresId, target, documentId]
      properties:
        figuresId: {type: integer, minimum: 1}
        target: {type: string, enum: [gross, cost]}
        costIndex: {type: integer, minimum: 0}
        documentId: {type: integer, minimum: 1}
    YearFigures:
      type: object
      required: [grossCents, grossDocumentId, costs, note]
      properties:
        grossCents: {type: string}
        grossDocumentId: {type: [integer, "null"]}
        note: {type: string}
        costs:
          type: array
          items:
            type: object
            required: [label, amountCents, documentId]
            properties:
              label: {type: string}
              amountCents: {type: string}
              documentId: {type: [integer, "null"]}
    DeclarationInput:
      type: object
      required: [declaredPerShareCents, declarationDate]
      properties:
        declaredPerShareCents: {type: string, pattern: '^\d{1,15}$'}
        declarationDate: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}
        note: {type: string, default: ""}
    YearCorrectionInput:
      type: object
      required: [kind]
      properties:
        kind: {type: string, enum: [note, grossAdjustment, costAdjustment, declaredPerShareAdjustment]}
        amountCents: {type: [string, "null"], pattern: '^-?\d{1,15}$'}
        documentId: {type: [integer, "null"]}
        declarationDate: {type: [string, "null"], pattern: '^\d{4}-\d{2}-\d{2}$'}
        note: {type: string, default: "", maxLength: 5000}
    PaymentInput:
      type: object
      required: [personId, kind, amountCents, date]
      properties:
        personId: {type: string, minLength: 1}
        kind: {type: string, enum: [cash, apic]}
        amountCents: {type: string, pattern: '^\d{1,15}$'}
        date: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}
        method: {type: string, maxLength: 200}
        note: {type: string, maxLength: 5000}
    ReversalInput:
      type: object
      required: [entryId, date]
      properties:
        entryId: {type: integer, minimum: 1}
        date: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}
        note: {type: string, default: "", maxLength: 5000}
    HoldInput:
      type: object
      required: [personId, held]
      properties:
        personId: {type: string, minLength: 1}
        held: {type: boolean}
        note: {type: string, default: "", maxLength: 5000}
    DocumentUploadInput:
      type: object
      required: [filename, contentType, size]
      properties:
        filename: {type: string, minLength: 1, maxLength: 200}
        contentType: {type: string, enum: [application/pdf, image/png, image/jpeg, image/webp, image/gif]}
        size: {type: integer, minimum: 1, maximum: 20971520}
    DocumentUpload:
      type: object
      required: [uploadId, uploadURL]
      properties:
        uploadId: {type: integer}
        uploadURL: {type: string}
    DocumentAttachmentInput:
      type: object
      required: [uploadId]
      properties:
        uploadId: {type: integer, minimum: 1}
    YearDocument:
      type: object
      required: [id, filename, contentType, size, uploadedAt, uploadedBy, downloadUrl]
      properties:
        id: {type: integer}
        filename: {type: string}
        contentType: {type: string}
        size: {type: integer}
        uploadedAt: {type: string}
        uploadedBy: {type: string}
        downloadUrl: {type: string}
    YearBlocker:
      type: object
      required: [personId, displayName, reason]
      properties:
        personId: {type: [string, "null"]}
        displayName: {type: string}
        reason: {type: string}
    YearCalculation:
      type: object
      required: [grossCents, costTotalCents, netProfitCents, federalRate, highestState, highestStateRate, combinedRate, poolCents, proposedPerShareCents, declaredPoolCents, sumNominalCents, residualCents]
      properties:
        grossCents: {type: string}
        costTotalCents: {type: string}
        netProfitCents: {type: string}
        federalRate: {type: string}
        highestState: {type: [string, "null"]}
        highestStateRate: {type: [string, "null"]}
        combinedRate: {type: [string, "null"]}
        poolCents: {type: [string, "null"]}
        proposedPerShareCents: {type: [string, "null"]}
        declaredPoolCents: {type: [string, "null"]}
        sumNominalCents: {type: [string, "null"]}
        residualCents: {type: [string, "null"]}
    YearHolder:
      type: object
      required: [personId, displayName, shareClass, shares, stateCode, residenceConfirmed, isUnsettled, stateRate, nominalCents, shareOfGainCents, estimatedTaxCents, surplusCents, paidCents, retainedCents, remainingCents, status, holdNote, isOnHold, instruction]
      properties:
        personId: {type: string}
        displayName: {type: string}
        shareClass: {type: string}
        shares: {type: string}
        stateCode: {type: [string, "null"]}
        residenceConfirmed: {type: boolean}
        isUnsettled: {type: boolean}
        stateRate: {type: [string, "null"]}
        nominalCents: {type: [string, "null"]}
        shareOfGainCents: {type: [string, "null"]}
        estimatedTaxCents: {type: [string, "null"]}
        surplusCents: {type: [string, "null"]}
        paidCents: {type: string}
        retainedCents: {type: string}
        remainingCents: {type: [string, "null"]}
        status: {type: string, enum: [open, held, complete]}
        holdNote: {type: [string, "null"]}
        isOnHold: {type: boolean}
        instruction: {type: string, enum: ["Pay", "Hold", "✓"]}
    PaymentEntry:
      type: object
      required: [id, personId, kind, amountCents, date, method, note, reversesEntryId, createdAt, createdBy]
      properties:
        id: {type: integer}
        personId: {type: string}
        kind: {type: string, enum: [cash, apic]}
        amountCents: {type: string}
        date: {type: string}
        method: {type: [string, "null"]}
        note: {type: string}
        reversesEntryId: {type: [integer, "null"]}
        createdAt: {type: string}
        createdBy: {type: string}
    YearHistory:
      type: object
      required: [id, kind, note, amountCents, createdAt, createdBy]
      properties:
        id: {type: string}
        kind: {type: string}
        note: {type: string}
        amountCents: {type: [string, "null"]}
        createdAt: {type: string}
        createdBy: {type: string}
        createdByName: {type: string}
        figures: {$ref: "#/components/schemas/YearFigures"}
        declarationDate: {type: string}
    YearTotals:
      type: object
      required: [nominalCents, paidCents, retainedCents, remainingCents, openCount, heldCount, completeCount]
      properties:
        nominalCents: {type: string}
        paidCents: {type: string}
        retainedCents: {type: string}
        remainingCents: {type: string}
        openCount: {type: integer}
        heldCount: {type: integer}
        completeCount: {type: integer}
    YearDetail:
      allOf:
        - {$ref: "#/components/schemas/YearSummary"}
        - type: object
          required: [figures, declaredPerShareCents, declarationDate, rateTableId, finalizedAt, calculation, originalCalculation, blockers, holders, totals, documents, payments, history]
          properties:
            figuresRevisionId: {type: [integer, "null"]}
            figures:
              anyOf:
                - {$ref: "#/components/schemas/YearFigures"}
                - {type: "null"}
            declaredPerShareCents: {type: [string, "null"]}
            declarationDate: {type: [string, "null"]}
            rateTableId: {type: integer}
            finalizedAt: {type: [string, "null"]}
            calculation:
              anyOf:
                - {$ref: "#/components/schemas/YearCalculation"}
                - {type: "null"}
            originalCalculation:
              anyOf:
                - {$ref: "#/components/schemas/YearCalculation"}
                - {type: "null"}
            blockers: {type: array, items: {$ref: "#/components/schemas/YearBlocker"}}
            holders: {type: array, items: {$ref: "#/components/schemas/YearHolder"}}
            totals: {$ref: "#/components/schemas/YearTotals"}
            documents: {type: array, items: {$ref: "#/components/schemas/YearDocument"}}
            payments: {type: array, items: {$ref: "#/components/schemas/PaymentEntry"}}
            history: {type: array, items: {$ref: "#/components/schemas/YearHistory"}}
    HealthStatus:
      type: object
      required: [status, build]
      properties: {status: {type: string}, build: {type: string}}
    Message:
      type: object
      required: [message]
      properties: {message: {type: string}}
    EmailInput:
      type: object
      required: [email]
      properties: {email: {type: string, format: email}}
    SuiteMenuItem:
      type: object
      required: [id, label, href]
      properties:
        id: {type: string}
        label: {type: string}
        href: {type: string}
        order: {type: number}
    SuiteMenu:
      type: object
      required: [version, items, tools, signOutHref, homeHref, source]
      properties:
        version: {type: string}
        items: {type: array, items: {$ref: "#/components/schemas/SuiteMenuItem"}}
        tools: {type: array, items: {$ref: "#/components/schemas/SuiteMenuItem"}}
        signOutHref: {type: string}
        homeHref: {type: string}
        source: {type: string, enum: [site, fallback]}
    Session:
      type: object
      required: [personId, displayName, environment, databaseName, serverAddress]
      properties:
        personId: {type: string}
        displayName: {type: string}
        environment: {type: string}
        databaseName: {type: string}
        serverAddress: {type: [string, "null"]}
    Holding:
      type: object
      required: [personId, displayName, shareClass, shares, isUnsettled, note, addressState]
      properties:
        personId: {type: string}
        displayName: {type: string}
        shareClass: {type: string, enum: [A, B, C, D]}
        shares: {type: string, pattern: '^\d{1,6}\.\d{4}$'}
        isUnsettled: {type: boolean}
        note: {type: [string, "null"]}
        addressState: {type: [string, "null"]}
    ClassTotal:
      type: object
      required: [shareClass, totalShares, holderCount]
      properties:
        shareClass: {type: string, enum: [A, B, C, D]}
        totalShares: {type: string}
        holderCount: {type: integer}
    Holdings:
      type: object
      required: [id, holdings, classes, grandTotal, asOf, fetchedAt]
      properties:
        id: {type: integer}
        holdings: {type: array, items: {$ref: "#/components/schemas/Holding"}}
        classes: {type: array, items: {$ref: "#/components/schemas/ClassTotal"}}
        grandTotal: {type: string}
        asOf: {type: string}
        fetchedAt: {type: string}
    HoldingsResult:
      type: object
      required: [holdings]
      properties:
        holdings:
          anyOf:
            - {$ref: "#/components/schemas/Holdings"}
            - {type: "null"}
    SnapshotInput:
      type: object
      required: [fetchId]
      properties:
        fetchId: {type: integer}
        note: {type: string, default: ""}
    Snapshot:
      type: object
      required: [id, fetchId, asOf, createdAt, createdBy, rowCount, grandTotal, note]
      properties:
        id: {type: integer}
        fetchId: {type: integer}
        asOf: {type: string}
        createdAt: {type: string}
        createdBy: {type: string}
        rowCount: {type: integer}
        grandTotal: {type: string}
        note: {type: string}
    ResidenceInput:
      type: object
      required: [personId, stateCode, confirmed]
      properties:
        personId: {type: string}
        expectedRevisionId: {type: integer, minimum: 1}
        stateCode: {type: string, pattern: '^(NONE|[A-Z]{2})$'}
        confirmed: {type: boolean}
        note: {type: string, maxLength: 5000}
    ResidenceBatchInput:
      type: object
      required: [revisionIds]
      properties:
        revisionIds:
          type: array
          maxItems: 10000
          items: {type: integer, minimum: 1}
    ResidenceStateCount:
      type: object
      required: [stateCode, count]
      properties:
        stateCode: {type: string}
        count: {type: integer}
    ResidenceSkipped:
      type: object
      required: [personId, displayName]
      properties:
        personId: {type: string}
        displayName: {type: string}
    ResidenceBatchResult:
      type: object
      required: [confirmedCount, confirmedBy, confirmedAt, stateCounts, skipped]
      properties:
        confirmedCount: {type: integer}
        confirmedBy: {type: string}
        confirmedAt: {type: string}
        stateCounts:
          type: array
          items: {$ref: "#/components/schemas/ResidenceStateCount"}
        skipped:
          type: array
          items: {$ref: "#/components/schemas/ResidenceSkipped"}
    Residence:
      type: object
      required: [id, personId, displayName, stateCode, confirmed, confirmedBy, confirmedAt, note]
      properties:
        id: {type: integer}
        personId: {type: string}
        displayName: {type: string}
        stateCode: {type: [string, "null"]}
        confirmed: {type: boolean}
        confirmedBy: {type: [string, "null"]}
        confirmedAt: {type: [string, "null"]}
        note: {type: string}
    StateRate:
      type: object
      required: [stateCode, rate]
      properties:
        stateCode: {type: string, pattern: '^(NONE|[A-Z]{2})$'}
        rate: {type: string, pattern: '^(0\.\d{4}|1\.0000)$'}
        sourceNote: {type: string, default: ""}
    RateInput:
      type: object
      required: [taxYear, federalRate, states]
      properties:
        taxYear: {type: integer, minimum: 1900, maximum: 9999}
        federalRate: {type: string, pattern: '^(0\.\d{4}|1\.0000)$'}
        federalSourceNote: {type: string, default: ""}
        states: {type: array, items: {$ref: "#/components/schemas/StateRate"}}
        note: {type: string, default: ""}
    RateCopyInput:
      type: object
      required: [fromYear, toYear]
      properties:
        fromYear: {type: integer, minimum: 1900, maximum: 9999}
        toYear: {type: integer, minimum: 1900, maximum: 9999}
        note: {type: string, default: ""}
    RateTable:
      allOf:
        - {$ref: "#/components/schemas/RateInput"}
        - type: object
          required: [id, createdAt, createdBy]
          properties:
            id: {type: integer}
            createdAt: {type: string}
            createdBy: {type: string}
    RateCsvInput:
      type: object
      required: [taxYear, filename, csv]
      properties:
        taxYear: {type: integer, minimum: 1900, maximum: 9999}
        filename: {type: string, minLength: 1, maxLength: 180}
        csv: {type: string, minLength: 1, maxLength: 65536}
    RateCsvConfirmation:
      allOf:
        - {$ref: "#/components/schemas/RateCsvInput"}
        - type: object
          required: [previewToken]
          properties:
            previewToken: {type: string, minLength: 1, maxLength: 2048}
    RateCsvRow:
      type: object
      required: [line, code, rate, sourceNote, currentRate, status]
      properties:
        line: {type: integer}
        code: {type: string}
        rate: {type: string}
        sourceNote: {type: string}
        currentRate: {type: [string, "null"]}
        status: {type: string, enum: [new, changed, unchanged]}
    RateCsvPreview:
      type: object
      required: [taxYear, filename, previewToken, rows, changedCount, unchangedCount]
      properties:
        taxYear: {type: integer}
        filename: {type: string}
        previewToken: {type: string}
        rows: {type: array, items: {$ref: "#/components/schemas/RateCsvRow"}}
        changedCount: {type: integer}
        unchangedCount: {type: integer}
    RateCsvResult:
      type: object
      required: [taxYear, filename, rows, changedCount, unchangedCount, importId]
      properties:
