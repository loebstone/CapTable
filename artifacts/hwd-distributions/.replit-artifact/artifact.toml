kind = "web"
previewPath = "/"
title = "HWD Distributions"
description = "Private HWD Farm distribution management foundation: delegated email sign-in, immutable holdings snapshots, tax residences, annual tax rates and shared access management."
version = "1.0.0"
id = "artifacts/hwd-distributions"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22889

[services.development]
run = "pnpm --filter @workspace/hwd-distributions run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/hwd-distributions", "run", "build" ]
serve = "static"
publicDir = "artifacts/hwd-distributions/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22889"
BASE_PATH = "/"
